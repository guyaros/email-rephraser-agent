<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Email Rephraser Agent</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
  body { background: #f5f7fb; font-size: .9rem; }
  .app { max-width: 760px; margin: 0 auto; padding: 2rem 1rem; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp .4s ease both; }

  .logo-box {
    width: 42px; height: 42px; border-radius: .75rem;
    background: var(--bs-primary);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  .section-label {
    font-size: .7rem; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: #6c757d;
  }

  textarea.mono-body { font-size: .9rem; line-height: 1.7; }

  #output-card.d-none { display: none; }
</style>
</head>
<body>
<div class="app">

  <header class="d-flex align-items-center gap-3 mb-4 fade-up">
    <div class="logo-box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
        <path d="M4 4h16v3H4zM4 10h10M4 14h12M4 18h8"/><path d="M18 14l2 2-4 4" stroke-width="2.2"/>
      </svg>
    </div>
    <div class="flex-grow-1">
      <h1 class="h5 mb-0 fw-semibold">
        Email Rephraser Agent
        <span id="version-badge" class="badge rounded-pill text-bg-light border ms-1 align-middle fw-normal" style="font-size:.65rem;"></span>
      </h1>
      <p class="text-muted small mb-0">Rephrase support emails professionally with AI</p>
    </div>
    <button class="btn btn-light btn-sm rounded-circle p-2" type="button" data-bs-toggle="collapse" data-bs-target="#settings-panel" title="Settings">
      <i class="bi bi-gear"></i>
    </button>
  </header>

  <!-- Settings dropdown -->
  <div class="collapse mb-3" id="settings-panel">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="section-label mb-2">API Key</div>
        <label class="form-label small">Anthropic API Key <span class="text-muted fw-normal">(saved in browser only)</span></label>
        <div class="input-group">
          <input type="password" id="api-key" class="form-control" placeholder="sk-ant-..." oninput="saveApiKey(this.value)"/>
          <button class="btn btn-outline-secondary" type="button" onclick="toggleApiKeyVisibility(event)">Show</button>
        </div>
        <div class="form-text">Get your key at <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a></div>
      </div>
    </div>
  </div>

  <!-- Input card -->
  <div class="card border-0 shadow-sm mb-3 fade-up">
    <div class="card-body">

      <div class="section-label mb-2">Writing as</div>
      <div class="btn-group w-100 mb-3" role="group">
        <input type="radio" class="btn-check" name="perspective" id="persp-self" value="myself" autocomplete="off" checked>
        <label class="btn btn-outline-primary" for="persp-self">Myself</label>
        <input type="radio" class="btn-check" name="perspective" id="persp-customer" value="customer" autocomplete="off">
        <label class="btn btn-outline-primary" for="persp-customer">On behalf of a customer</label>
      </div>

      <hr>
      <div class="section-label mb-2">Device details</div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label small">Device model</label>
          <select id="model" class="form-select" onchange="toggleCustomModel(this.value); updateActionPresets(this.value)">
            <option value="">-- Select model --</option>
            <optgroup label="Formlabs">
              <option value="Fuse 1">Fuse 1</option>
              <option value="Fuse 1+">Fuse 1+</option>
              <option value="Sift">Sift</option>
              <option value="Blast">Blast</option>
              <option value="Form 4">Form 4</option>
              <option value="Form 4B">Form 4B</option>
              <option value="Form 4L">Form 4L</option>
              <option value="Form 4BL">Form 4BL</option>
              <option value="Wash V1">Wash V1</option>
              <option value="Wash V2">Wash V2</option>
              <option value="Wash L V1">Wash L V1</option>
              <option value="Wash L V2">Wash L V2</option>
              <option value="Cure V1">Cure V1</option>
              <option value="Cure V2">Cure V2</option>
              <option value="Cure L">Cure L</option>
              <option value="Cure L V2">Cure L V2</option>
            </optgroup>
            <optgroup label="Markforged">
              <option value="Onyx One">Onyx One</option>
              <option value="Onyx Pro">Onyx Pro</option>
              <option value="Mark Two">Mark Two</option>
              <option value="X7">X7</option>
              <option value="FX10">FX10</option>
              <option value="FX20">FX20</option>
            </optgroup>
            <optgroup label="HP">
              <option value="HP 4200">HP 4200</option>
              <option value="HP 5200">HP 5200</option>
              <option value="HP 5600">HP 5600</option>
              <option value="HP 540">HP 540</option>
              <option value="HP 580">HP 580</option>
            </optgroup>
            <optgroup label="Creaform / Peel3D">
              <option value="Peel 3">Peel 3</option>
            </optgroup>
            <option value="__other__">Other...</option>
          </select>
          <input type="text" id="model-custom" class="form-control mt-2 d-none" placeholder="Type device model..." />
        </div>
        <div class="col-md-6">
          <label class="form-label small">Device S/N</label>
          <input type="text" id="sn" class="form-control" placeholder="e.g. SN-2024-00847" />
        </div>
      </div>

      <hr>
      <div class="section-label mb-2">Urgency</div>
      <div class="btn-group w-100 mb-3" role="group">
        <input type="radio" class="btn-check" name="urgency" id="u-low" value="Low — not time-sensitive" autocomplete="off">
        <label class="btn btn-outline-success" for="u-low">Low</label>
        <input type="radio" class="btn-check" name="urgency" id="u-normal" value="Normal — standard priority" autocomplete="off" checked>
        <label class="btn btn-outline-warning" for="u-normal">Normal</label>
        <input type="radio" class="btn-check" name="urgency" id="u-high" value="High — urgent, needs prompt attention" autocomplete="off">
        <label class="btn btn-outline-danger" for="u-high">High (Blocker)</label>
      </div>

      <hr>

      <div class="mb-3">
        <label class="form-label small">Previous message received (optional)</label>
        <textarea id="prev-msg" class="form-control" rows="3" placeholder="Paste the previous message you received here so the agent understands the conversation context..."></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label small">Recipient name (optional)</label>
        <input type="text" id="recipient" class="form-control" placeholder="e.g. John, Sarah, Support Team..." />
      </div>

      <div class="mb-3">
        <label class="form-label small">Your draft</label>
        <textarea id="draft" class="form-control" rows="6" placeholder="Paste your rough draft, notes, or bullet points here..."></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label small">Actions taken (optional)</label>
        <div id="action-checkboxes" class="d-flex flex-wrap gap-2 mb-2"></div>
        <textarea id="actions" class="form-control" rows="2" placeholder="E.g. restarted the device, replaced the sensor, updated firmware to v2.3..."></textarea>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label small">Tone</label>
          <select id="tone" class="form-select">
            <option value="professional and firm">Professional &amp; firm</option>
            <option value="polite and collaborative" selected>Polite &amp; collaborative</option>
            <option value="urgent and assertive">Urgent &amp; assertive</option>
            <option value="friendly but direct">Friendly but direct</option>
            <option value="formal and precise">Formal &amp; precise</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small">Goal</label>
          <select id="goal" class="form-select">
            <option value="write a clear and appropriate reply or message based on the draft and context provided">General correspondence</option>
            <option value="request a fix or resolution">Request a fix / resolution</option>
            <option value="reply to an incoming email">Reply to incoming email</option>
            <option value="escalate an unresolved issue">Escalate an issue</option>
            <option value="follow up on a previous request">Follow up</option>
            <option value="request a status update">Request status update</option>
            <option value="claim warranty or replacement">Claim warranty / replacement</option>
            <option value="get a quote or pricing">Get a quote / pricing</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small">Length</label>
        <div class="btn-group w-100" role="group">
          <input type="radio" class="btn-check" name="length" id="len-detailed" value="detailed" autocomplete="off">
          <label class="btn btn-outline-primary" for="len-detailed">Detailed</label>
          <input type="radio" class="btn-check" name="length" id="len-concise" value="concise" autocomplete="off" checked>
          <label class="btn btn-outline-primary" for="len-concise">Concise</label>
          <input type="radio" class="btn-check" name="length" id="len-very-concise" value="very concise" autocomplete="off">
          <label class="btn btn-outline-primary" for="len-very-concise">Very concise</label>
        </div>
      </div>

      <button class="btn btn-primary w-100" id="rephrase-btn" onclick="rephrase()">Rephrase email</button>
    </div>
  </div>

  <!-- Output card -->
  <div class="card border-0 shadow-sm d-none" id="output-card">
    <div class="card-body">
      <div class="section-label mb-3">Result — edit &amp; refine</div>

      <div class="input-group mb-3">
        <span class="input-group-text">Subject</span>
        <input type="text" id="out-subject" class="form-control fw-medium" placeholder="Subject line..." onclick="this.select()" />
      </div>

      <label class="form-label small">Body</label>
      <textarea id="out-body" class="form-control mono-body mb-3" rows="10" placeholder="Email body will appear here..."></textarea>

      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-outline-secondary flex-fill" onclick="openModal('body')">Copy body</button>
        <button class="btn btn-outline-secondary flex-fill" onclick="openModal('all')">Copy all</button>
        <button class="btn btn-primary flex-fill" id="improve-btn" onclick="improve()">Improve this version</button>
      </div>

      <div class="d-flex align-items-center gap-2 text-muted small mt-3 d-none" id="status-bar">
        <span class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true"></span>
        <span id="status-msg">Processing...</span>
      </div>
    </div>
  </div>

</div>

<!-- Copy modal -->
<div class="modal fade" id="copy-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title mb-0">Copy email</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-2">לחץ בתוך הטקסט ← Ctrl+A לבחירת הכל ← Ctrl+C להעתקה</p>
        <textarea id="modal-text" class="form-control" style="height:300px;" readonly onclick="this.select()"></textarea>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x mb-4" style="z-index:1080;">
  <div class="toast align-items-center text-bg-dark border-0" id="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toast-body"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const VERSION = 'v2.0 · Oct 2026';
  let settings = {};

  // Load saved API key from localStorage
  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('version-badge').textContent = VERSION;
    const saved = localStorage.getItem('anthropic_api_key');
    if (saved) document.getElementById('api-key').value = saved;
    updateActionPresets('');
  });

  function saveApiKey(val) {
    localStorage.setItem('anthropic_api_key', val.trim());
  }

  function toggleApiKeyVisibility(event) {
    const input = document.getElementById('api-key');
    const btn = event.target;
    if (input.type === 'password') { input.type = 'text'; btn.textContent = 'Hide'; }
    else { input.type = 'password'; btn.textContent = 'Show'; }
  }

  function getApiKey() {
    return document.getElementById('api-key').value.trim();
  }

  // ── Action presets per device ──────────────────────────────────
  const DEFAULT_ACTIONS = [
    'Media files uploaded',
    'Logs uploaded',
    'Firmware is up to date',
    'Software up to date'
  ];

  const DEVICE_ACTIONS = {
    'Fuse 1':  [...DEFAULT_ACTIONS, 'Optical pathway cleaned', 'Powder cleaned thoroughly'],
    'Fuse 1+': [...DEFAULT_ACTIONS, 'Optical pathway cleaned', 'Powder cleaned thoroughly'],
    'Sift':    [...DEFAULT_ACTIONS, 'Hopper cleaned thoroughly', 'Shutter rail cleaned'],
    'Blast':   [...DEFAULT_ACTIONS, 'Hopper cleaned thoroughly'],
    'Form 4':  [...DEFAULT_ACTIONS, 'Resin tank inspected', 'Build platform cleaned'],
    'Form 4B': [...DEFAULT_ACTIONS, 'Resin tank inspected', 'Build platform cleaned'],
    'Form 4L': [...DEFAULT_ACTIONS, 'Resin tank inspected', 'Build platform cleaned'],
    'Form 4BL':[...DEFAULT_ACTIONS, 'Resin tank inspected', 'Build platform cleaned'],
    'Wash V1': [...DEFAULT_ACTIONS, 'IPA bath replaced', 'Wash basket cleaned'],
    'Wash V2': [...DEFAULT_ACTIONS, 'IPA bath replaced', 'Wash basket cleaned'],
    'Wash L V1':[...DEFAULT_ACTIONS, 'IPA bath replaced', 'Wash basket cleaned'],
    'Wash L V2':[...DEFAULT_ACTIONS, 'IPA bath replaced', 'Wash basket cleaned'],
    'Cure V1': [...DEFAULT_ACTIONS, 'Turntable cleaned', 'UV chamber inspected'],
    'Cure V2': [...DEFAULT_ACTIONS, 'Turntable cleaned', 'UV chamber inspected'],
    'Cure L':  [...DEFAULT_ACTIONS, 'Turntable cleaned', 'UV chamber inspected'],
    'Cure L V2':[...DEFAULT_ACTIONS, 'Turntable cleaned', 'UV chamber inspected'],
    'Peel 3': [...DEFAULT_ACTIONS, 'Scanner calibrated'],
    'HP 4200': [...DEFAULT_ACTIONS, 'Print heads cleaned', 'Carriage belt inspected'],
    'HP 5200': [...DEFAULT_ACTIONS, 'Print heads cleaned', 'Carriage belt inspected'],
    'HP 5600': [...DEFAULT_ACTIONS, 'Print heads cleaned', 'Carriage belt inspected'],
    'HP 540':  [...DEFAULT_ACTIONS, 'Print heads cleaned'],
    'HP 580':  [...DEFAULT_ACTIONS, 'Print heads cleaned'],
  };

  function updateActionPresets(modelVal) {
    const container = document.getElementById('action-checkboxes');
    const presets = DEVICE_ACTIONS[modelVal] || DEFAULT_ACTIONS;
    container.innerHTML = '';
    presets.forEach((val, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'form-check form-check-inline m-0';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'form-check-input';
      cb.id = `action-chk-${i}`;
      cb.value = val;
      cb.onchange = syncCheckboxes;
      const lbl = document.createElement('label');
      lbl.className = 'form-check-label small text-muted';
      lbl.htmlFor = cb.id;
      lbl.textContent = val;
      wrap.appendChild(cb);
      wrap.appendChild(lbl);
      container.appendChild(wrap);
    });
    // Clear actions textarea when model changes
    document.getElementById('actions').value = '';
  }

  function syncCheckboxes() {
    const allPresets = Array.from(document.querySelectorAll('#action-checkboxes input[type=checkbox]')).map(c => c.value);
    const checked = Array.from(document.querySelectorAll('#action-checkboxes input[type=checkbox]:checked')).map(c => c.value);
    const manual = document.getElementById('actions').value;
    const manualLines = manual.split('\n').filter(l => l.trim() && !allPresets.includes(l.trim()));
    document.getElementById('actions').value = [...checked, ...manualLines].join('\n');
  }

  function toggleCustomModel(val) {
    const custom = document.getElementById('model-custom');
    custom.classList.toggle('d-none', val !== '__other__');
    if (val !== '__other__') custom.value = '';
  }

  function getModelValue() {
    const sel = document.getElementById('model').value;
    if (sel === '__other__') return document.getElementById('model-custom').value.trim();
    return sel;
  }

  function showToast(msg) {
    document.getElementById('toast-body').textContent = msg;
    bootstrap.Toast.getOrCreateInstance(document.getElementById('toast'), { delay: 2200 }).show();
  }

  function setStatus(msg) {
    const bar = document.getElementById('status-bar');
    const txt = document.getElementById('status-msg');
    if (msg) { bar.classList.remove('d-none'); txt.textContent = msg; }
    else { bar.classList.add('d-none'); }
  }

  async function callClaude(prompt) {
    const apiKey = getApiKey();
    if (!apiKey) { throw new Error('Please enter your Anthropic API key at the top.'); }
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'anthropic-version': '2023-06-01',
        'anthropic-beta': 'server-side-fallback-2026-07-01',
        'anthropic-dangerous-direct-browser-access': 'true',
        'x-api-key': apiKey
      },
      body: JSON.stringify({
        model: 'claude-opus-5-5',
        max_tokens: 4096,
        output_config: { effort: 'low' },
        fallbacks: 'default',
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }
    const data = await res.json();
    if (data.stop_reason === 'refusal') {
      throw new Error(data.stop_details?.explanation || 'The request was declined by Anthropic\'s safety checks.');
    }
    return data.content?.find(b => b.type === 'text')?.text || '';
  }

  function parseOutput(text) {
    const subjectMatch = text.match(/Subject:\s*(.+)/i);
    const bodyMatch = text.match(/Body:\s*([\s\S]+?)(?:---DONE---|$)/i);
    return {
      subject: subjectMatch ? subjectMatch[1].trim() : '',
      body: bodyMatch ? bodyMatch[1].trim() : text.trim()
    };
  }

  function populateOutput(subject, body) {
    document.getElementById('out-subject').value = subject;
    document.getElementById('out-body').value = body;
    const card = document.getElementById('output-card');
    card.classList.remove('d-none');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function rephrase() {
    const draft = document.getElementById('draft').value.trim();
    if (!draft) { showToast('Please paste your email draft first.'); return; }

    const tone = document.getElementById('tone').value;
    const goal = document.getElementById('goal').value;
    const actions = document.getElementById('actions').value.trim();
    const prevMsg = document.getElementById('prev-msg').value.trim();
    const model = getModelValue();
    const sn = document.getElementById('sn').value.trim();
    const urgency = document.querySelector('input[name="urgency"]:checked').value;
    const length = document.querySelector('input[name="length"]:checked').value;
    const recipient = document.getElementById('recipient').value.trim();
    const onBehalfOfCustomer = document.querySelector('input[name="perspective"]:checked').value === 'customer';

    const hasDeviceContext = !!(model || sn || actions);
    settings = { tone, goal, urgency, length, hasDeviceContext, onBehalfOfCustomer };

    const deviceLine = (model || sn)
      ? `\nDevice info: ${[model ? 'Model: ' + model : '', sn ? 'S/N: ' + sn : ''].filter(Boolean).join(' | ')}`
      : '';
    const actionsLine = actions ? `\nActions already taken: ${actions}` : '';
    const prevMsgLine = prevMsg ? `\n\nPrevious message received:\n"""\n${prevMsg}\n"""` : '';
    const recipientLine = recipient ? `\nRecipient name: ${recipient} (open the email with "Hi ${recipient}," — never use "Dear")` : '\nDo not use "Dear" — if no recipient name is provided, start directly with the email content or use "Hi," as the opener.';

    const lengthInstruction = {
      'detailed':     'Write in full detail — be thorough, elaborate on context, and do not omit any relevant information.',
      'concise':      'Keep the email concise and to the point. Remove any unnecessary sentences.',
      'very concise': 'Keep the email very brief — 3 to 5 short sentences maximum. Essential information only, no filler.'
    }[length];

    const roleFraming = onBehalfOfCustomer
      ? `You are helping a reseller/support company write professional emails to equipment suppliers on behalf of their customers. The writer is NOT the end customer — they are the reseller or support engineer contacting the supplier about a customer's equipment issue. Always refer to the equipment as "our customer's device" or "the customer's unit", not "our device" or "our equipment", unless the context clearly states otherwise.`
      : `You are helping the writer draft a professional email in their own voice, in the first person, on their own behalf — not on behalf of a customer or any other party. ${hasDeviceContext ? 'If device details are mentioned, refer to the equipment as "my device" or "our equipment", never "the customer\'s device".' : ''} The subject may be anything — do not assume it is about equipment, support tickets, or suppliers unless the draft itself says so. Base the content entirely on the draft and context given below.`;

    const deviceRules = hasDeviceContext
      ? `\n- If device model or S/N are provided, include them clearly in the email body\n- If actions taken are listed, include them in the email as a bullet point list under a short intro line like "The following actions have been taken:"${onBehalfOfCustomer ? '\n- Always refer to the device as the customer\'s equipment, not ours' : ''}`
      : '';

    const structureLine = hasDeviceContext
      ? 'Structure: brief opener, issue/request, expected action, closing'
      : 'Structure: brief opener, main content, any next steps or requests, closing';

    const prompt = `${roleFraming}

Please rephrase the following email draft. Use a "${tone}" tone. The goal is to "${goal}".
Urgency level: ${urgency}
Email length: ${length} — ${lengthInstruction}${deviceLine}${actionsLine}${recipientLine}${prevMsgLine}

Rules:
- Keep all key facts and specific details
- Never use em-dashes or double hyphens anywhere in the output; use a comma, colon, or rewrite the sentence instead
- Use professional language appropriate for the recipient and subject matter${deviceRules}
- If a previous message is provided, use it to understand the conversation context and make the reply relevant and coherent
- Reflect the urgency level in the tone and wording
- Strictly follow the length instruction above
- ${structureLine}
- End the email with: "Best regards,"
- Output in this exact format:

Subject: [generated subject line]

Body:
[rephrased email body]

---DONE---

Original draft:
${draft}`;

    const btn = document.getElementById('rephrase-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Rephrasing...';

    try {
      const text = await callClaude(prompt);
      const { subject, body } = parseOutput(text);
      populateOutput(subject, body);
    } catch(e) {
      showToast('Error: ' + (e.message || 'Something went wrong'));
    }

    btn.disabled = false;
    btn.innerHTML = 'Rephrase email';
  }

  async function improve() {
    const subject = document.getElementById('out-subject').value.trim();
    const body = document.getElementById('out-body').value.trim();
    if (!subject && !body) { showToast('Nothing to improve yet.'); return; }

    const roleFraming = settings.onBehalfOfCustomer
      ? `You are helping a reseller/support company write professional emails to equipment suppliers on behalf of their customers. Always refer to the equipment as "our customer's device" or "the customer's unit", not "our device" or "our equipment", unless the context clearly states otherwise.`
      : `You are helping the writer polish a well-written email written in their own voice, on their own behalf — not on behalf of a customer or any other party. The subject may be anything — do not assume it is about equipment or support unless the text itself says so.`;

    const prompt = `${roleFraming}

I have edited this email. Please improve it slightly: fix any grammar, improve flow and professionalism, and ensure it reads naturally. Keep all the content and intent exactly as written. Do not change the meaning or add new information. Never use em-dashes or double hyphens anywhere in the output. If actions taken are listed, keep them as bullet points.

Tone: ${settings.tone || 'professional and firm'}

  function removeEmDash(text) {
    return text.replace(/—/g, '-').replace(/--/g, '-');
  }

  function openModal(mode) {
    const subject = document.getElementById('out-subject').value.trim();
    const body = removeEmDash(document.getElementById('out-body').value.trim());
    const text = mode === 'all' ? `Subject: ${subject}\n\n${body}` : body;
    const modalEl = document.getElementById('copy-modal');
    const modalText = document.getElementById('modal-text');
    modalText.value = text;
    bootstrap.Modal.getOrCreateInstance(modalEl).show();
    modalEl.addEventListener('shown.bs.modal', () => { modalText.focus(); modalText.select(); }, { once: true });
  }
